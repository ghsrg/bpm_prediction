data:
  dataset_label: loan_v1_v5_simulated
  dataset_name: loan_v1_v5_complex_simulated
  log_path: C:\Users\korsr\PycharmProjects\bpm_prediction\outputs\simulation\loan_v1_v5_complex_simulated.xes
mapping:
  adapter: xes
  knowledge_graph:
    backend: neo4j
    path: data/knowledge_graph
    strict_load: true
    ingest_split: train
  graph_feature_mapping:
    node_numeric:
    - name: node_exec_count_v_all
      metric: exec_count
      window: all_time
      scope: version
      default: 0.0
      encoding:
      - identity
    - name: node_duration_median_v_all
      metric: duration_median
      window: all_time
      scope: version
      default: 0.0
      encoding:
      - identity
    - name: node_duration_p95_v_all
      metric: duration_p95
      window: all_time
      scope: version
      default: 0.0
      encoding:
      - identity
    - name: node_loop_density_v_all
      metric: loop_density
      window: all_time
      scope: version
      default: 0.0
      encoding:
      - identity
    - name: node_parallel_var_v_all
      metric: parallel_token_variance
      window: all_time
      scope: version
      default: 0.0
      encoding:
      - identity
    - name: node_freshness_v_all
      metric: freshness_score
      window: all_time
      scope: version
      default: 0.0
      encoding:
      - identity
    - name: node_confidence_v_all
      metric: confidence_score
      window: all_time
      scope: version
      default: 0.0
      encoding:
      - identity
    - name: node_exec_count_p_all
      metric: exec_count
      window: all_time
      scope: process
      default: 0.0
      encoding:
      - identity
    - name: node_duration_median_p_all
      metric: duration_median
      window: all_time
      scope: process
      default: 0.0
      encoding:
      - identity
    - name: node_duration_p95_p_all
      metric: duration_p95
      window: all_time
      scope: process
      default: 0.0
      encoding:
      - identity
    - name: node_loop_density_p_all
      metric: loop_density
      window: all_time
      scope: process
      default: 0.0
      encoding:
      - identity
    - name: node_parallel_var_p_all
      metric: parallel_token_variance
      window: all_time
      scope: process
      default: 0.0
      encoding:
      - identity
    - name: node_freshness_p_all
      metric: freshness_score
      window: all_time
      scope: process
      default: 0.0
      encoding:
      - identity
    - name: node_confidence_p_all
      metric: confidence_score
      window: all_time
      scope: process
      default: 0.0
      encoding:
      - identity
    edge_weight:
      metric: transition_probability
      window: all_time
      scope: version
      default: 1.0
      encoding:
      - identity
    stats_quality_gate:
      enabled: true
      on_fail: allow_with_warning
      warn_on_fail: true
    topology_projection:
      gateway_mode: collapse_for_prediction
  xes_adapter:
    case_id_key: concept:name
    activity_key: concept:name
    timestamp_key: time:timestamp
    resource_key: org:resource
    lifecycle_key: lifecycle:transition
    version_key: concept:version
    start_transitions:
    - start
    complete_transitions:
    - complete
    pairing_strategy: lifo
    use_classifier: true
  features:
  - name: concept:name
    role: activity
    source: event
    dtype: string
    fill_na: <UNK>
    encoding:
    - embedding
  - name: org:resource
    role: resource
    source: event
    dtype: string
    fill_na: UNKNOWN
    encoding:
    - embedding
  - name: time:timestamp
    role: timestamp
    source: event
    dtype: timestamp
    fill_na: 0.0
    encoding:
    - z-score
    - time2vec_dayofweek
    - time2vec_month
    - time2vec_hour
    - time2vec_work_hours
  - name: duration
    source: event
    dtype: float
    fill_na: 0.0
    encoding:
    - z-score
  - name: time_since_case_start
    source: event
    dtype: float
    fill_na: 0.0
    encoding:
    - z-score
  - name: time_since_previous_event
    source: event
    dtype: float
    fill_na: 0.0
    encoding:
    - z-score
policies:
  profile: mvp1_default
  activity_fallback_feature: concept:name
  zscore_clip:
    enabled: true
    min: -3.0
    max: 3.0
  time2vec:
    work_hours:
      timezone: UTC
      working_days:
      - 0
      - 1
      - 2
      - 3
      - 4
      start_hour: 9
      end_hour: 18
model:
  model_label: GATv2
  type: EOPKGTopologyConditioned
  hidden_dim: 64
  struct_encoder_type: GATv2Conv
  struct_hidden_dim: 64
  cross_attention_heads: 4
  dropout: 0.2
  graph_strategy: sequential_prefix
  pooling_strategy: last_node
  candidate_scoring: cosine
  candidate_pooling: logmeanexp
  topology_conditioning_mode: static_candidates
  impulse_activation_enabled: false
  fusion_mode: StructXAttn
  structural_score_mode: bilinear_with_prior
  structural_logit_scale_init: 0.1
  structural_logit_scale_max: 2.0
  structural_observed_scale_min: 1.0
  structural_observed_scale_max: 10.0
  structural_stats_beta: 0.1
  topology_state_beta: 1.5
  topology_state_beta_max: 2.0
  topology_state_gate_init_bias: -2.0
  topology_state_class_pooling: logmeanexp
  topology_state_dropout: 0.2
  topology_graph_pooling: mean
  structural_prior_pooling: mean
  structural_prior_fusion: concat
  structural_prior_gate_init_bias: -1.0
  struct_xattn_layers: post_conv2
  struct_xattn_heads: 4
  struct_xattn_dropout: 0.2
  struct_xattn_scale_init: 0.1
  struct_xattn_scale_max: 0.1
  struct_xattn_use_layer_norm: true
  struct_xattn_use_gate: true
  struct_xattn_gate_init_bias: -2.0
  struct_xattn_merge_mode: pre_norm_context
  struct_xattn_delta_ratio_max: 0.3
  observed_encoder: GATv2
  struct_encoder: GATv2
  candidate_temperature_init: 0.1
  candidate_temperature_min: 0.05
  candidate_temperature_max: 2.0
  candidate_temperature_trainable: false
  impulse_state_channels:
  - is_last_event
  - prefix_executed_count_log1p
  - prefix_recency_norm
  impulse_scale_init: 0.0
  impulse_scale_max: 0.1
  impulse_gnn_layers: 1
  impulse_residual_h0: true
  recurrent_type: lstm
  recurrent_layers: 1
  recurrent_bidirectional: false
training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  patience: 20
  delta: 1e-4
  device: cpu
  ece_bins: 10
  class_weight_cap: 50.0
  loss_function: cross_entropy
  show_progress: true
  tqdm_disable: false
  tqdm_leave: false
  retrain: true
  mask_guided_policy: auto
  mask_guided_apply_in_eval: true
  mask_guided_hard_threshold: 1.0
  mask_guided_soft_penalty: 2.0
  dataloader_num_workers: 0
  dataloader_persistent_workers: true
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  mask_guided_min_samples_for_hard: 1
  sharded_dataset_cached_shards: 2
  torch_num_interop_threads: 2
  torch_num_threads: 8
  structural_aux_loss_enabled: false
  structural_aux_loss_weight: 0.0
  structural_aux_exact_loss_weight: 0.0
  struct_xattn_contrastive_enabled: false
  struct_xattn_contrastive_weight: 0.03
  struct_xattn_contrastive_margin: 0.05
  struct_xattn_contrastive_temperature: 0.1
  struct_xattn_contrastive_max_loss: 0.5
  struct_xattn_contrastive_warmup_epochs: 3
  struct_xattn_corruption_policy: edge_drop
  struct_xattn_corruption_edge_drop_prob: 0.4
  struct_xattn_corruption_feature_noise_std: 0.0
  learning_strategy: topology_conditioned
  dynamic_candidate_contract_enabled: true
  topology_conditioning_wrong_version_negative_enabled: true
  candidate_contract_mode: candidate_id
  topology_conditioning_wrong_version_negative_weight: 0.1
  candidate_batch_topology_policy: single_topology_required
  topology_conditioning_wrong_version_margin: 0.2
  candidate_identity_mode: topology_native
  topology_conditioning_drop_edges_negative_enabled: true
  candidate_missing_target_fail_threshold: 0.1
  topology_conditioning_drop_edges_negative_weight: 0.05
  process_state_mask_enabled: true
  topology_conditioning_drop_edges_margin: 0.1
  process_state_mask_source: relaxed_reachability
  topology_conditioning_drop_edges_ratio: 0.15
  process_state_mask_include_direct_successors: true
  topology_conditioning_allowed_set_loss_enabled: true
  process_state_mask_include_active_candidates: true
  topology_conditioning_allowed_set_loss_weight: 0.05
  process_state_mask_relaxed_lookback_events: 8
  topology_flow_penalty_enabled: true
  process_state_mask_relaxed_max_depth: 1
  topology_flow_penalty_weight: 0.05
  process_state_mask_relaxed_max_cardinality_ratio: 0.35
  topology_flow_penalty_type: invalid_probability_mass
  process_state_mask_relaxed_suppress_completed: true
  topology_conditioning_retention_recent_versions: 1
  topology_flow_penalty_margin: 0.1
  process_state_mask_relaxed_anchor_policy: open_successors
  topology_conditioning_retention_recent_weight: 0.5
  topology_flow_penalty_fail_on_missing_mask: true
  process_state_mask_relaxed_loop_policy: keep_direct_successor_repeats
  topology_conditioning_retention_enabled: false
  topology_conditioning_retention_old_weight: 0.15
  topology_conditioning_retention_obsolete_weight: 0.0
  topology_conditioning_retention_policy: version_decay
  topology_conditioning_current_version_policy: latest_in_train
tracking:
  enabled: true
  backend: mlflow
  uri: file:./mlruns
  tags:
    stage: mvp1_cross_dataset
    model_family: eopkg_topology_conditioned
  tracing:
    enabled: true
    stages: test,eval_drift_one_pass
    sample_policy: interesting
    max_traces_per_run: 80
    max_traces_per_stage: 40
    max_traces_per_version: 10
    random_sample_rate: 0.0
    high_confidence_threshold: 0.8
    low_confidence_threshold: 0.4
    top_k: 5
    log_json_artifact_fallback: true
    allow_nonzero_rank_fallback: false
experiment:
  project: mvp2_6-test
  name: _EOPKG_WI-UN-f1-5-32
  mode: train
  fraction: 1.0
  split_strategy: versioned
  train_ratio: 0.38
  split_ratio:
  - 0.7
  - 0.2
  - 0.1
  stats_time_policy: strict_asof
  fraction_strategy: versioned
  version_scope_policy: train_cut
  on_missing_asof_snapshot: use_base
  cache_policy: full
  graph_dataset_cache_policy: full
  graph_dataset_cache_dir: .cache/graph_datasets
  graph_dataset_disk_spill_enabled: true
  cache_dir: .cache/dynamic_graph_builder
  graph_dataset_shard_size: 10000
  max_ram_gb: 10
  structural_mode: true
  statistic_enabled: false
  mask_guided_enabled: false
  retrain: true
  drift_window_size: 100
  drift_window_sliding: 10
seed: 32
sync_stats:
  quality_gate:
    enabled: true
    on_fail: write_with_flag
    warn_on_fail: true
    zero_dominant_threshold: 0.95
    min_non_zero_ratio_overall: 0.0
    min_history_coverage_percent: 0.0
  alignment_gate:
    enabled: true
    profile: legacy_exact
    candidate_node_fields:
    - id
    ignore_structural_only_nodes: false
    strip_classifier_suffix: false
    normalize_case: false
    collapse_separators: false
    fail_on_ambiguity: true
    warn_on_fail: true
    min_event_match_ratio: 0.6
    min_unique_activity_coverage: 0.6
    min_node_coverage: 0.0
    on_fail: write_with_flag

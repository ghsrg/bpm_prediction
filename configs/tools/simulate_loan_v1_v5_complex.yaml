arrival_process:
  type: "poisson"
  rate_per_hour: 1.54
  max_cases: 5600

version_carryover:
  enabled: false
  targets:
    - completion: "same_version"
      probability: 0.70
    - completion: "next_version"
      probability: 0.15
    - completion: "skip_one_version"
      probability: 0.10
    - completion: "last_version"
      probability: 0.05
  jitter_seconds:
    type: "uniform"
    min: 3600
    max: 604800


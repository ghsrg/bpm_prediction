    - camunda_sync_files_neo4j
    - camunda_sync_sql_file
    - camunda_sync_sql_neo4j
    - synthetic_drift_4tu
    - xes_sync_dir_file
    - xes_sync_dir_neo4j
    label: Мітка датасету
    path: data.dataset_label
    required_in_modes: []
    required_when: {}
    section: data
    ui:
      group: source
      order: 2
      priority: 1
      tab: input
  data.dataset_name:
    affects: Input loading and process identity.
    default: ''
    description: Canonical process/dataset identifier used for structure lookup and
      run profile.

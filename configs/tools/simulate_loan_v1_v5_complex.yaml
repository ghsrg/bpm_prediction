        max_traversals_per_case: 1
        repeat_until_max_once_selected: false
        when: {const: true}
      - flow_id: "sf007"
        when: {const: true}

  gw_eligible:
    default_flow_id: "sf019"
    branches:
      - flow_id: "Flow_1qhaurq"
        when:
          all:
            - var: "p_eligibility"

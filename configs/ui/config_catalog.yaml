  model.fusion_mode:
    affects: How structural context is combined with observed branch in EOPKG mode.
    default: ClassMeanAttention
    description: ClassMeanAttention keeps old Attention semantics; ClassMeanConcat
      keeps old Concat/struct_pool_concat semantics; ClassAwareStructuralScoring adds
      per-class structural logits to observed logits; TopologyStateEncoder projects
      observed prefix state onto topology nodes before structural message passing
      and pools node logits to classes; TopologyStateGraphEncoder projects observed
      prefix state onto topology nodes, performs topology message passing, then classifies
      a graph-level topology context; StructuralPriorEncoder uses etalon-like representation-level
      fusion with observed context plus pooled structural context before classifier;
      StructXAttn uses token-level structural cross-attention from observed IG nodes
      to structural nodes before pooling.
    enum:
    - ClassMeanAttention
    - ClassMeanConcat
    - ClassAwareStructuralScoring
    - TopologyStateEncoder
    - TopologyStateGraphEncoder
    - StructuralPriorEncoder
    - StructXAttn
    label: 'Модель: Fusion mode'
    path: model.fusion_mode
